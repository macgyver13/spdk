[workspace]
members = [
    "spdk-core",
    "backend-blindbit-native",
    "backend-blindbit-wasm",
]
resolver = "2"

[workspace.dependencies]
# Internal workspace crates
spdk-core = { path = "spdk-core", version = "0.1.0" }

# Core dependencies - shared across crates
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bdk_coin_select = "0.4.0"
bitcoin = { version = "0.32.8", features = ["serde", "rand", "base64"] }
dnssec-prover = "0.1"
futures = "0.3"
futures-util = "0.3.31"
hex = { version = "0.4.3", features = ["serde"] }
hmac = "0.12"
log = "0.4"
reqwest = { version = "0.12.26", features = ["json", "gzip"], default-features = false }
psbt-v2 = { git = "https://github.com/tcharding/rust-psbt.git", branch = "master", features = ["silent-payments"] }
rayon = "1.10.0"
rust-dleq = { git = "https://github.com/macgyver13/rust-dleq.git", branch = "master", default-features = false }
secp256k1 = "0.29"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
sha2 = "0.10"
# silentpayments = "0.4"
silentpayments = { git = "https://github.com/macgyver13/rust-silentpayments.git", branch = "bip375-additions" }
tempfile = "3.8"
thiserror = "1.0"
tokio = { version = "1.48.0", features = ["rt"], default-features = false }


[workspace.package]
repository = "https://github.com/cygnet3/spdk"
